services:
  graham-bot:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Override DB path to write inside the named volume
      DATABASE_URL: sqlite:////data/graham_bot.db
    volumes:
      - graham_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  graham_data:
