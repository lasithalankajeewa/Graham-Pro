name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -c "import ast; ast.parse(open('graham_bot.py').read()); print('✅ Syntax OK')"

# Streamlit Cloud watches the main branch and redeploys automatically on every
# push — no separate deploy job is needed here.
